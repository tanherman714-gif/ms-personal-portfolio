<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matthew Setiady | Personal Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--amber:#F5A400;--ink:#141414;--paper:#fff;--soft:#FFF1CC;--dark:#141414;--mute:#5b5b5b;--line:#14141422;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f6f6f6;--paper:#121212;--soft:#242014;--mute:#b0b0b0;--line:#ffffff26}}
:root[data-theme="dark"]{--ink:#f6f6f6;--paper:#121212;--soft:#242014;--mute:#b0b0b0;--line:#ffffff26}
html{scroll-padding-top:90px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.125rem/1.7 "Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.sans{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.logo{font:900 1.3rem Archivo,Arial,sans-serif;text-decoration:none;background:var(--amber);color:#141414;padding:2px 10px;border-radius:6px}
nav{display:flex;align-items:center;gap:8px}
nav a.link{font:800 .95rem Archivo,Arial,sans-serif;text-decoration:none;padding:8px 12px;border-radius:999px;transition:background .2s}
nav a.link:hover{background:var(--soft)}
nav a.link.on{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--amber)}
nav a.cta{background:var(--ink);color:var(--paper)}
nav a.cta:hover{background:var(--amber);color:#141414}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-left:4px}
.lang button{font:800 .8rem Archivo,Arial,sans-serif;border:0;background:none;color:var(--ink);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{display:inline-block;font:800 1rem Archivo,Arial,sans-serif;text-decoration:none;background:var(--ink);color:var(--paper);padding:15px 28px;border-radius:999px;border:2px solid var(--ink);transition:transform .2s,background .2s,color .2s}
.btn:hover{background:var(--amber);color:#141414;transform:translateY(-2px)}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover{background:var(--amber);color:#141414}
.view[hidden]{display:none}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:56px 0 80px;min-height:calc(100vh - 150px)}
.name{font-size:clamp(3rem,8vw,6rem);font-weight:900;letter-spacing:-.03em}
.headline{font:800 clamp(1.4rem,2.6vw,2rem) Archivo,Arial,sans-serif;margin:20px 0 14px;max-width:18ch;line-height:1.15}
.hero p.lead{max-width:34em;color:var(--mute);margin:0 0 24px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;margin:0 0 32px;padding:16px 0;border-block:2px solid var(--ink)}
.facts dt{font:800 .95rem Archivo,Arial,sans-serif}
.facts dd{margin:0;font-style:italic}
.portrait{position:relative;margin:0 0 24px 24px}
.portrait::before{content:"";position:absolute;inset:24px -24px -24px 24px;border-radius:32px;background:var(--amber);
 background-image:radial-gradient(#14141455 22%,transparent 24%);background-size:16px 16px}
.portrait img{position:relative;display:block;width:100%;aspect-ratio:4/4.4;object-fit:cover;object-position:35% 30%;border-radius:32px;border:3px solid var(--ink);box-shadow:0 18px 40px #0003}
/* sections */
section{padding:72px 0}
.title{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:900;letter-spacing:-.02em;max-width:16ch}
.tag{display:inline-block;background:var(--amber);color:#141414;font:800 .85rem Archivo,Arial,sans-serif;padding:3px 10px;border-radius:6px;margin-bottom:16px}
.intro{font-size:1.3rem;max-width:36em;margin-top:24px}
h2.sec{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;letter-spacing:-.02em;margin-bottom:12px}
.sub{color:var(--mute);max-width:38em;margin:0 0 32px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--soft);border-radius:20px;padding:28px;border-top:6px solid var(--amber);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #0002}
.card h3{font-size:1.35rem;font-weight:800;margin-bottom:10px}
.card p{margin:0}
.ig{grid-column:1/-1;background:var(--dark);color:#fff;border-top-color:var(--amber);display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ig .btn{background:var(--amber);color:#141414;border-color:var(--amber)}
.ig .btn:hover{background:#fff;border-color:#fff}
.ig small{display:block;color:var(--amber);font:800 .95rem Archivo,Arial,sans-serif;margin-bottom:6px}
.book{background:var(--paper);border:2px solid var(--ink);border-radius:6px 20px 20px 6px;border-left-width:14px;border-left-color:var(--amber);padding:26px}
.book h3{font-size:1.4rem;font-weight:900}
.book .by{color:var(--mute);font-style:italic;margin:4px 0 14px}
.book ul{margin:0;padding-left:1.1em}.book li{margin-bottom:6px}
.vals{display:grid;gap:0;border-top:2px solid var(--ink)}
.val{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:20px 0;border-bottom:2px solid var(--ink);transition:padding-left .25s,background .25s}
.val:hover{padding-left:14px;background:var(--soft)}
.val h3{font-size:1.6rem;font-weight:900}
.vision{background:var(--amber);color:#141414;border-radius:28px;padding:clamp(28px,6vw,64px)}
.vision p{font-size:1.35rem;max-width:36em;margin:20px 0 0}
.quote{background:var(--dark);color:#fff;text-align:center;padding:110px 24px}
.quote q{display:block;font:900 clamp(2.6rem,10vw,7rem)/1 Archivo,Arial,sans-serif;letter-spacing:-.03em;quotes:none;color:var(--amber)}
.quote small{display:block;margin-top:20px;opacity:.7;font-style:italic}
.back{text-align:center;padding:56px 0 24px}
footer{border-top:2px solid var(--ink);padding:32px 0;text-align:center}
footer b{font-family:Archivo,Arial,sans-serif}footer span{display:block;color:var(--mute);font-style:italic}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media (max-width:860px){
 .hero{grid-template-columns:1fr;gap:40px;padding-top:32px}
 .portrait{order:-1;margin:0 24px 24px 0;max-width:460px}
 .g2,.g3{grid-template-columns:1fr}
 .val{grid-template-columns:1fr;gap:4px}
}
@media (max-width:480px){
 .wrap{padding:0 18px}.logo{display:none}
 nav a.link{padding:8px 10px;font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<main id="about" class="view" hidden>
 <div class="wrap">
  <section style="padding-bottom:24px">
   <span class="tag" data-en="About Me" data-id="Tentang Saya"></span>
   <h1 class="title" data-en="About Me — My Journey, My Growth." data-id="Tentang Saya — Perjalanan dan Pertumbuhan Saya."></h1>
   <p class="intro" data-en="My name is Matthew Setiady. I am a student who believes that personal growth comes from continuous learning, consistent effort, and the courage to improve. I enjoy sports because they teach me discipline and perseverance, while learning helps me broaden my perspective and prepare for future opportunities." data-id="Nama saya Matthew Setiady. Saya seorang pelajar yang percaya bahwa pertumbuhan diri datang dari belajar terus-menerus, usaha yang konsisten, dan keberanian untuk berkembang. Saya menyukai olahraga karena mengajarkan disiplin dan ketekunan, sementara belajar memperluas sudut pandang dan mempersiapkan saya untuk peluang di masa depan."></p>
  </section>

  <section class="rv">
   <h2 class="sec" data-en="My Achievements" data-id="Pencapaian Saya"></h2>
   <p class="sub" data-en="A journey that keeps growing. These are milestones of progress, not official awards." data-id="Perjalanan yang terus berkembang. Ini adalah tonggak kemajuan, bukan penghargaan resmi."></p>
   <div class="grid g2" id="ach"></div>
  </section>

  <section class="rv">
   <h2 class="sec" data-en="Books That Shaped Me" data-id="Buku yang Membentuk Saya"></h2>
   <p class="sub" data-en="Four favorite books and the lessons I take from each." data-id="Empat buku favorit dan pelajaran yang saya ambil dari masing-masing."></p>
   <div class="grid g2" id="books"></div>
  </section>

  <section class="rv">
   <h2 class="sec" data-en="My Interests" data-id="Minat Saya"></h2>
   <div class="grid g3" id="interests" style="margin-top:28px"></div>
  </section>

  <section class="rv">
   <h2 class="sec" data-en="My Values" data-id="Nilai-Nilai Saya"></h2>
   <div class="vals" id="vals" style="margin-top:28px"></div>
  </section>

  <section class="rv">
   <div class="vision">
    <h2 class="sec" data-en="The Person I Aspire to Become" data-id="Sosok yang Ingin Saya Jadi"></h2>
    <p data-en="My goal is not simply to achieve success, but to become someone who uses knowledge, discipline, and opportunities to create meaningful value for others. I want to keep learning, challenge my limitations, and grow into a person who can make a positive impact on the world." data-id="Tujuan saya bukan sekadar meraih kesuksesan, tetapi menjadi pribadi yang menggunakan ilmu, disiplin, dan kesempatan untuk memberi nilai bermakna bagi orang lain. Saya ingin terus belajar, menantang batas diri, dan bertumbuh menjadi orang yang dapat memberi dampak positif bagi dunia."></p>

<script>
const $=s=>document.querySelector(s);
const el=(cls,html)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;return d};
const t=(en,id)=>`data-en="${en}" data-id="${id}"`;
const IG='https://www.instagram.com/menujuatletis.id?utm_source=ig_web_button_share_sheet&fqnt=ZDNlZDc0MzIxNw==';
const ach=[
 ['Academic Growth','Pertumbuhan Akademik','My commitment to learning, developing new skills, and improving my academic performance.','Komitmen saya untuk belajar, mengembangkan keterampilan baru, dan meningkatkan prestasi akademik.'],
 ['Content Creation','Pembuatan Konten','My experience in creating and editing short-form educational content, with a focus on fitness and personal development.','Pengalaman saya membuat dan mengedit konten edukasi berdurasi pendek, berfokus pada kebugaran dan pengembangan diri.'],
 ['Personal Development','Pengembangan Diri','My ongoing journey toward becoming more disciplined, consistent, and responsible.','Perjalanan saya menjadi pribadi yang lebih disiplin, konsisten, dan bertanggung jawab.'],
 ['Future Goals','Tujuan Masa Depan','My ambition to pursue meaningful opportunities, develop valuable skills, and create a positive impact on others.','Ambisi saya mengejar peluang bermakna, mengembangkan keterampilan berharga, dan memberi dampak positif bagi orang lain.']];
const books=[
 ['Atomic Habits','James Clear',['Tiny 1% improvements compound into remarkable results.','Build systems, not just goals.','Lasting change starts with identity: become the kind of person who does the habit.'],['Perbaikan kecil 1% yang berulang menghasilkan hasil luar biasa.','Bangun sistem, bukan hanya target.','Perubahan bertahan dimulai dari identitas: jadilah orang yang melakukan kebiasaan itu.']],
 ['Think and Grow Rich','Napoleon Hill',['Define a clear purpose and write it down.','Persistence turns setbacks into progress.','Your mindset and beliefs shape your actions and results.'],['Tentukan tujuan yang jelas dan tuliskan.','Ketekunan mengubah kegagalan menjadi kemajuan.','Pola pikir dan keyakinan membentuk tindakan dan hasil.']],
 ['Building a Second Brain','Tiago Forte',['Capture ideas so your mind stays free to think.','Organize and distill knowledge so it is easy to use.','Learning matters most when you turn it into something you share.'],['Catat ide agar pikiran bebas untuk berpikir.','Atur dan sarikan pengetahuan agar mudah dipakai.','Belajar paling bermakna ketika diubah menjadi karya yang dibagikan.']],
 ['The Psychology of Money','Morgan Housel',['Behavior matters more than intelligence.','Patience lets compounding do its work.','Know what is enough, and keep a margin of safety.'],['Perilaku lebih penting daripada kecerdasan.','Kesabaran membiarkan efek bunga majemuk bekerja.','Tahu kapan sudah cukup, dan sediakan ruang aman.']]];
const ints=[
 ['Sports &amp; Fitness','Olahraga &amp; Kebugaran','Building discipline, maintaining an active lifestyle, and striving for continuous improvement.','Membangun disiplin, menjaga gaya hidup aktif, dan terus berusaha menjadi lebih baik.'],
 ['Learning &amp; Technology','Belajar &amp; Teknologi','Exploring new knowledge, developing practical skills, and understanding technology.','Menjelajahi pengetahuan baru, mengembangkan keterampilan praktis, dan memahami teknologi.'],
 ['Content Creation','Pembuatan Konten','Sharing useful ideas and creating educational content that can benefit others.','Berbagi ide bermanfaat dan membuat konten edukasi yang berguna bagi orang lain.']];
const vals=[
 ['Faith','Iman','Trust in God.','Percaya kepada Tuhan.'],
 ['Discipline','Disiplin','Staying consistent even when motivation fades.','Tetap konsisten bahkan saat motivasi menurun.'],
 ['Growth','Bertumbuh','Learning from mistakes and becoming better every day.','Belajar dari kesalahan dan menjadi lebih baik setiap hari.'],
 ['Integrity','Integritas','Doing what is right, even when no one is watching.','Melakukan hal yang benar, bahkan saat tidak ada yang melihat.'],
 ['Impact','Dampak','Using knowledge and skills to make a positive difference.','Menggunakan ilmu dan keterampilan untuk memberi perubahan positif.']];

ach.forEach(a=>$('#ach').append(el('card',`<h3 ${t(a[0],a[1])}></h3><p ${t(a[2],a[3])}></p>`)));
$('#ach').insertBefore(el('card ig',`<div style="max-width:34em"><small>Instagram · @menujuatletis.id</small><h3 ${t('Channel: Menuju Atletis','Channel: Menuju Atletis')}></h3><p ${t('An Instagram channel where I share educational content about body health and fitness.','Channel Instagram tempat saya membagikan konten edukasi tentang kesehatan tubuh dan kebugaran.')}></p></div><a class="btn" href="${IG}" target="_blank" rel="noopener noreferrer" ${t('Visit @menujuatletis.id','Kunjungi @menujuatletis.id')}></a>`),$('#ach').children[2]);
books.forEach(b=>$('#books').append(el('book',`<h3>${b[0]}</h3><p class="by">${b[1]}</p><ul>${b[2].map((x,i)=>`<li ${t(x,b[3][i])}></li>`).join('')}</ul>`)));
ints.forEach(a=>$('#interests').append(el('card',`<h3 ${t(a[0],a[1])}></h3><p ${t(a[2],a[3])}></p>`)));
vals.forEach(v=>$('#vals').append(el('val',`<h3 ${t(v[0],v[1])}></h3><p style="margin:0" ${t(v[2],v[3])}></p>`)));

let lang='en';
function setLang(l){lang=l;document.documentElement.lang=l;
 document.querySelectorAll('[data-en]').forEach(n=>n.innerHTML=n.dataset[l]);
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
 try{localStorage.setItem('lang',l)}catch(e){}}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12}):null;
function route(){const p=location.hash==='#about'?'about':'home';
 ['home','about'].forEach(v=>$('#'+v).hidden=v!==p);
 $('#nav-home').classList.toggle('on',p==='home');$('#nav-about').classList.toggle('on',p==='about');
 document.title=(p==='about'?'About Me | ':'')+'Matthew Setiady | Personal Portfolio';
 window.scrollTo(0,0);
 document.querySelectorAll('#'+p+' .rv').forEach(n=>io?io.observe(n):n.classList.add('in'));}
addEventListener('hashchange',route);
let saved='en';try{saved=localStorage.getItem('lang')||(navigator.language||'').startsWith('id')?'id':'en';const s=localStorage.getItem('lang');if(s)saved=s}catch(e){}
setLang(saved);route();
</script>
